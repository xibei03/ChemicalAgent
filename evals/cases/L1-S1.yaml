id: L1-S1
purpose: "考核场景 1 原文：两个反应都写出来了，没有转化率和动力学，重整炉不是点名的反应器"
source: "docs/REQUIREMENT.md 第 42 至 46 行"
scenario: true
repeats: 5
input: |-
  "我需要模拟甲烷蒸汽重整。进料是甲烷和水蒸气（摩尔比 1:2.7）有两个反应，主反应甲烷和水反应生成一氧化碳和氢气；副反应一样化碳和水蒸汽反应生成二氧化碳和氢气，请分析以下两种情况下反应炉的组分分布：
  "1、重整炉出口气温度为 710°C，压力 13.5 bar，进料温度520℃，""
  2、重整炉出口气温度为600℃，压力13.5bar，进料温度520℃
  进料流量可以自定，要求符合一个工厂一年正常的处理量
  提示：探讨同种反应在不同温度下的产物分布**
expected:
  reactor: equilibrium
  features:
    named_reactor: null
    kinetics_given: false
    conversion_data_given: false
    reaction_defined: true
    black_box_system: false
  # 阶段 2B：规格里“用户明确给出的量”，规范化之后比较（组成是摩尔分率，数值的相对容差 1e-3）。
  params:
    feeds:
      - temperature_c: 520
        pressure_bar: 13.5
        composition: {Methane: 0.2703, H2O: 0.7297}
    reactions:
      - {kind: equilibrium, stoichiometry: {Methane: -1, H2O: -1, CO: 1, Hydrogen: 3}}
      - {kind: equilibrium, stoichiometry: {CO: -1, H2O: -1, CO2: 1, Hydrogen: 1}}
    heat_mode: specified_outlet_temperature
    cases: [{outlet_temperature_c: 710}, {outlet_temperature_c: 600}]
  # 必须登记成假设的字段：自定的流量；进料压力取题面给的那一个压力；压力按绝压。
  assumed: ["feeds[0].molar_flow_kmol_h", "feeds[0].pressure_bar", "feeds[0].pressure_bar"]
