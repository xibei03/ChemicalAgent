id: L1-S2b
purpose: "场景 2 去掉“转化率反应器”的字样：没有点名，仍因给出转化率数值而选 Conversion"
input: |-
  请帮我完成甲苯歧化反应的模拟，甲苯原料发生歧化反应：2C₇H₈ → C₆H₆ + C₈H₁₀。甲苯进料流量10000kg/h，进料温度为380℃，操作压力2.5MPa，甲苯转化率为50%，反应产物为苯和二甲苯（邻、间、对三种异构体），请配置反应并模拟产物分布和流股组成。
  用户明确提出不对反应动力学进行深入探讨，只需要知道在该转化率下反应器出口的浓度分布，不考虑其他副反应
expected:
  reactor: conversion
  features:
    named_reactor: null
    kinetics_given: false
    conversion_data_given: true
    reaction_defined: true
