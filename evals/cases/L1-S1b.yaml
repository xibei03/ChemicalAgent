id: L1-S1b
purpose: "场景 1 的英文改写，单位换成 MPa 和 K：类型不因语言和单位而变"
input: |-
  I need to simulate methane steam reforming. The feed is methane and steam at a molar ratio of 1:2.7. Two reactions take place: in the main reaction, methane reacts with water to give carbon monoxide and hydrogen; in the side reaction, carbon monoxide reacts with steam to give carbon dioxide and hydrogen. Please analyze the outlet composition of the reformer in two cases: (1) reformer outlet temperature 983 K, pressure 1.35 MPa, feed temperature 793 K; (2) reformer outlet temperature 873 K, pressure 1.35 MPa, feed temperature 793 K. The feed flow rate is up to you, but it should match the normal annual throughput of a plant.
expected:
  reactor: equilibrium
  features:
    kinetics_given: false
    conversion_data_given: false
    reaction_defined: true
    black_box_system: false
    phase: gas
  # 单位换成 K 和 MPa、语言换成英文：规范化之后的参数与 L1-S1 一致（K 的换算带来约 0.15 °C 的差，在容差内）。
  params:
    feeds:
      - temperature_c: 520
        pressure_bar: 13.5
        composition: {Methane: 0.2703, H2O: 0.7297}
    reactions:
      - {kind: equilibrium, stoichiometry: {Methane: -1, H2O: -1, CO: 1, Hydrogen: 3}}
      - {kind: equilibrium, stoichiometry: {CO: -1, H2O: -1, CO2: 1, Hydrogen: 1}}
    heat_mode: specified_outlet_temperature
    cases: [{outlet_temperature_c: 710}, {outlet_temperature_c: 600}]
  assumed: ["feeds[0].molar_flow_kmol_h", "feeds[0].pressure_bar", "feeds[0].pressure_bar"]
