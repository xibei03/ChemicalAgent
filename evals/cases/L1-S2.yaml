id: L1-S2
purpose: "考核场景 2 原文：点名转化率反应器，给出转化率 50%，声明不讨论动力学"
source: "docs/REQUIREMENT.md 第 51 至 52 行"
scenario: true
repeats: 5
input: |-
  "请帮我完成甲苯歧化反应的模拟，甲苯原料进入转化率反应器，发生歧化反应：2C₇H₈ → C₆H₆ + C₈H₁₀。甲苯进料流量10000kg/h，进料温度为380℃，操作压力2.5MPa，甲苯转化率为50%，反应产物为苯和二甲苯（邻、间、对三种异构体），请配置反应并模拟产物分布和流股组成"
  用户明确提出不对反应动力学进行深入探讨，只需要知道在该转化率下反应器出口的浓度分布，不考虑其他副反应
expected:
  reactor: conversion
  features:
    named_reactor: conversion
    kinetics_given: false
    conversion_data_given: true
    reaction_defined: true
    black_box_system: false
  params:
    feeds:
      - temperature_c: 380
        pressure_bar: 25
        mass_flow_kg_h: 10000
        composition: {Toluene: 1.0}
    reactions:
      # 三种二甲苯的分配是假设：只比较它们的系数之和
      - kind: conversion
        stoichiometry: {Toluene: -2, Benzene: 1}
        sums: [{components: [p-Xylene, m-Xylene, o-Xylene], total: 1.0}]
        base_component: Toluene
        conversion_percent: 50
    heat_mode: adiabatic
    cases: [{}]
  # 必须登记成假设的字段：三种异构体的分配；绝热；进料压力取操作压力；压力按绝压。
  assumed: ["reactions[0].stoichiometry", "heat_mode", "feeds[0].pressure_bar", "feeds[0].pressure_bar"]
