# 场景 1：甲烷蒸汽重整（计划 §17.1）。手写的规格，供 Recipe 编译和结果验证的测试使用。
#
# 两个可逆反应、没有动力学参数、要两个出口温度下的产物分布，所以是平衡反应器；
# 平衡常数由 HYSYS 按 Gibbs 自由能计算。
reactor_type: equilibrium
property_package: peng_robinson
components: [Methane, H2O, CO, CO2, Hydrogen]

feeds:
  - name: Feed
    temperature_c: 520.0
    pressure_bar: 13.5
    molar_flow_kmol_h: 3700.0
    # 甲烷和水蒸气的摩尔比 1 : 2.7，换算成摩尔分率：1 / 3.7 和 2.7 / 3.7。
    composition:
      - {component: Methane, mole_fraction: 0.2702702703}
      - {component: H2O, mole_fraction: 0.7297297297}

reactions:
  # R1：CH4 + H2O <=> CO + 3 H2
  - kind: equilibrium
    stoichiometry:
      - {component: Methane, coefficient: -1.0}
      - {component: H2O, coefficient: -1.0}
      - {component: CO, coefficient: 1.0}
      - {component: Hydrogen, coefficient: 3.0}
    keq_source: gibbs_energy
    phase: vapour
  # R2：CO + H2O <=> CO2 + H2
  - kind: equilibrium
    stoichiometry:
      - {component: CO, coefficient: -1.0}
      - {component: H2O, coefficient: -1.0}
      - {component: CO2, coefficient: 1.0}
      - {component: Hydrogen, coefficient: 1.0}
    keq_source: gibbs_energy
    phase: vapour

pressure_drop_bar: 0.0
heat_mode: specified_outlet_temperature
cases:
  - {name: T710, outlet_temperature_c: 710.0}
  - {name: T600, outlet_temperature_c: 600.0}

metrics:
  - {kind: conversion, component: Methane}
  - {kind: ratio, numerator: Hydrogen, denominator: CO}

assumptions:
  - id: A1-1
    field_path: feeds[0].molar_flow_kmol_h
    value: "3700 kmol/h（甲烷 1000，水 2700）"
    reason: 题面没有给流量。流量不影响平衡组成，只影响流量和热负荷的绝对值。
  - id: A1-2
    field_path: feeds[0].pressure_bar
    value: "13.5 bar 为绝压"
    reason: 题面没有说明绝压还是表压。按表压算 CH4 转化率会低约 1 个百分点。
  - id: A1-3
    field_path: pressure_drop_bar
    value: "0"
    reason: 题面只给了一个压力，进料压力等于反应器压力。
  - id: A1-4
    field_path: reactions[0].keq_source
    value: gibbs_energy
    reason: 用户没有提供平衡常数，由 Gibbs 自由能计算。
  - id: A1-5
    field_path: feeds[0].composition
    value: "进料只含甲烷和水"
    reason: 题面如此。
